plugins {
    id 'com.android.application'
}
android {
    namespace 'com.rts.game'
    compileSdk 33
    ndkVersion "25.2.9519653"
    defaultConfig {
        applicationId "com.rts.game"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags ""
                cFlags "-O3 -ffp-contract=off"
                arguments "-DPLATFORM=Android", "-DANDROID_PLATFORM=android-24"
                /* arm64-v8a only: covers all modern devices (Play Store
                   requires 64-bit) and avoids Raylib's stb fp16 NEON
                   intrinsics that don't compile on 32-bit armeabi-v7a. */
                abiFilters 'arm64-v8a'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    sourceSets {
        main {
            assets.srcDirs += ['../../assets']
        }
    }
}
